<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Public+Sans:wght@400;500;600;700&display=swap');
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; }

.btn-wifi { flex:1; border:1.5px solid #1E3350; background:#fff; color:#1E3350; border-radius:10px; padding:10px 6px; font-size:14px; font-weight:700; cursor:pointer; }
.btn-wifi.actif { background:#1E3350; color:#fff; }
.qr-zone { display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 0 2px; }
#qr-code { background:#fff; padding:12px; border:1px solid #E4E0D5; border-radius:12px; line-height:0; }
.tabs { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; display:flex; background:#1E3350; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); gap:3px; }
.tab { flex:1; background:transparent; color:#B8C4D6; border:none; border-radius:10px; padding:11px 0; font-size:11.5px; font-weight:600; cursor:pointer; white-space:nowrap; }

<body>
<div id="app"><p class="info">Chargement des données partagées…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ------------------------- Constantes locales ------------------------- */

var SLOT_LABEL = { dej:'Déjeuner', din:'Dîner' };
var CATS = [ {id:'courses',label:'Courses communes'}, {id:'apero',label:'Apéro / alcool'}, {id:'autre',label:'Autre'} ];
var JOURS_FR = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
var JOURS_FR_COURT = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
var MOIS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

/* ------------------------- État ---------------------------------------- */

var DATA = null;
var JOURS = [];       // jours du séjour, recalculés à chaque rendu depuis la config
var TAB = 'repas';
var PREMIER = true;   // premier chargement (pour ouvrir Réglages si séjour vierge)
var ARME = null;      // id du bouton de suppression armé
var ARME_TIMER = null;
var ADMIN_CRED = null; // {email, pass} si connecté (mémorisé sur l'appareil)
var ADMIN_CFG = null;  // config alertes {on, cats} chargée après connexion
var PANNEAU = false;   // panneau admin déplié
var LOGIN_UI = false;  // formulaire de connexion admin affiché (?admin=1)
var CATS_ALERTES = [['repas','Repas'],['depenses','Dépenses'],['famille','Famille'],['chambres','Chambres'],['wifi','Wifi'],['courses','Pense-bête de courses'],['reglages','Réglages']];
var FICHIER_DEP = null; // File choisi pour la facture (photo/PDF), avant envoi
var NOTE_DEP = '';    // message informatif sous le formulaire de dépense
var MAX_PJ = 5 * 1024 * 1024; // 5 Mo pour un fichier envoyé tel quel (PDF…)
var QR_OUVERT = null; // id du bâtiment dont le QR wifi est affiché
var PRESENCE_EDIT = false; // sélecteurs de dates d'arrivée/départ dépliés (onglet Famille)
var PRESENCE_DETAIL = {}; // ménages dont le détail par personne est ouvert (mode édition)
var PRESENCE_FOYERS = {}; // ménages dont l'édition des dates est ouverte individuellement

/* ------------------------- Utilitaires --------------------------------- */

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function eur(n) {
  return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n||0);
}
function parseMontant(s) {
  var v = parseFloat(String(s).replace(',','.').replace(/[^0-9.\-]/g,''));
  return isNaN(v) ? null : Math.round(v*100)/100;
}
function frNum(n){ return (n||0).toLocaleString('fr-FR',{maximumFractionDigits:2}); }

/* --- Dates du séjour --- */

function dateValide(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s||'')); }
function enDate(iso){ return new Date(iso + 'T12:00:00'); }
function numFr(n){ return n===1 ? '1er' : String(n); }
function jourLabel(dt){ return JOURS_FR[dt.getDay()]+' '+numFr(dt.getDate())+' '+MOIS_FR[dt.getMonth()]; }
function jourCourt(dt){
  var m = dt.getMonth()+1;
  return JOURS_FR_COURT[dt.getDay()]+' '+String(dt.getDate()).padStart(2,'0')+'/'+String(m).padStart(2,'0');
}
/** Jours du séjour d'après la config : dîner seul le jour d'arrivée,
 *  déjeuner seul le jour du départ. Vide si les dates sont absentes ou incohérentes. */
function joursSejour() {
  var c = DATA.config||{};
  if (!dateValide(c.debut) || !dateValide(c.fin)) return [];
  var deb = enDate(c.debut), fin = enDate(c.fin);
  if (fin < deb) return [];
  var out = [], d = new Date(deb), n = 0;
  while (d <= fin && n < 62) {
    var iso = d.toISOString().slice(0,10);
    var slots = (+d===+deb && +d===+fin) ? ['dej','din'] : (+d===+deb) ? ['din'] : (+d===+fin) ? ['dej'] : ['dej','din'];
    out.push({ id: iso, label: jourLabel(d), court: jourCourt(d), slots: slots });
    d.setDate(d.getDate()+1); n++;
  }
  return out;
}
function periodeCourte() {
  var c = DATA.config||{};
  if (!dateValide(c.debut) || !dateValide(c.fin)) return 'Dates à régler';
  var a = enDate(c.debut), b = enDate(c.fin);
  return numFr(a.getDate())+' '+MOIS_FR[a.getMonth()]+' → '+numFr(b.getDate())+' '+MOIS_FR[b.getMonth()];
}
function lienLabel(e) {
  if (Array.isArray(e.pour) && e.pour.length) return 'pour '+e.pour.join(' + ');
  var cat = CATS.find(function(c){return c.id===e.link;});
  return cat ? cat.label : slotNom(e.link);
}
function slotNom(id) {
  var i = String(id).lastIndexOf('-');
  if (i === -1) return id;
  var day = id.slice(0,i), s = id.slice(i+1);
  var j = JOURS.find(function(x){return x.id===day;});
  return j ? (SLOT_LABEL[s]||s)+' · '+j.court : (dateValide(day) ? (SLOT_LABEL[s]||s)+' · '+jourCourt(enDate(day)) : id);
}

/* --- Présence (arrivée/départ de chacun) --- */

function nuitsEntre(a, b) {
  if (!dateValide(a) || !dateValide(b)) return 0;
  return Math.max(0, Math.round((enDate(b) - enDate(a)) / 86400000));
}
/** Bornes de présence d'un participant, ramenées dans les dates du séjour.
 *  Champ vide = présent tout le séjour. */
function bornesPresence(p) {
  var c = DATA.config||{};
  var a = dateValide(p.arrivee) ? p.arrivee : c.debut;
  var d = dateValide(p.depart) ? p.depart : c.fin;
  if (dateValide(c.debut) && a < c.debut) a = c.debut;
  if (dateValide(c.fin) && d > c.fin) d = c.fin;
  if (d < a) d = a;
  return { a:a, d:d };
}

function listeFoyers() {
  var set = (DATA.foyers||[]).slice();
  DATA.participants.forEach(function(p){ if(p.foyer && set.indexOf(p.foyer)===-1) set.push(p.foyer); });
  return set;
}
function equipes() {
  return listeFoyers().filter(function(f){
    return DATA.participants.some(function(p){ return p.foyer===f && (parseFloat(p.poids)||0)>=1; });
  });
}
function parId(id) { return DATA.participants.find(function(p){return p.id===id;}); }

/** Concerné par les dépenses apéro/alcool ; défaut : les personnes à 1 part. */
function aperoDe(p) {
  return p.hasOwnProperty('apero') ? !!p.apero : (parseFloat(p.poids)||0) >= 1;
}
function comptes() {
  var c = DATA.config||{};
  var nuitsTotal = nuitsEntre(c.debut, c.fin);
  var prorata = !!c.prorata && nuitsTotal > 0;
  function poidsEff(p) {
    var w = parseFloat(p.poids)||0;
    if (!prorata || !w) return w;
    var b = bornesPresence(p);
    return w * nuitsEntre(b.a, b.d) / nuitsTotal;
  }
  var foyers = listeFoyers(), parts = {}, aperoP = {}, paye = {}, du = {};
  foyers.forEach(function(f){ parts[f]=0; aperoP[f]=0; paye[f]=0; du[f]=0; });
  DATA.participants.forEach(function(p){
    var w = poidsEff(p);
    parts[p.foyer]=(parts[p.foyer]||0)+w;
    if (aperoDe(p)) aperoP[p.foyer]=(aperoP[p.foyer]||0)+w;
  });
  var totalParts = 0, totalApero = 0;
  Object.keys(parts).forEach(function(f){ totalParts+=parts[f]; totalApero+=aperoP[f]||0; });
  /* Assiduité aux repas : les absents signalés sur un repas (onglet Repas) et
     les personnes pas encore arrivées ou déjà reparties ne comptent ni pour ce
     repas ni, au prorata, pour les courses communes. */
  var jours = joursSejour();
  var slotsSejour = [];
  jours.forEach(function(j){ j.slots.forEach(function(s){ slotsSejour.push(j.id+'-'+s); }); });
  function presentSlot(p, slotId) {
    var i = slotId.lastIndexOf('-'), day = slotId.slice(0,i), svc = slotId.slice(i+1);
    var b = bornesPresence(p);
    if (day < b.a || day > b.d) return false;
    if (b.a !== b.d || day !== b.a) {
      if (day === b.a && svc === 'dej') return false;
      if (day === b.d && svc === 'din') return false;
    }
    var mm = DATA.meals[slotId];
    return !(mm && Array.isArray(mm.absents) && mm.absents.indexOf(p.id) !== -1);
  }
  var assP = {}, totalAss = 0, nbAbsents = 0;
  foyers.forEach(function(f){ assP[f]=0; });
  slotsSejour.forEach(function(s){ var mm=DATA.meals[s]; if (mm && Array.isArray(mm.absents)) nbAbsents += mm.absents.length; });
  DATA.participants.forEach(function(p){
    var w = parseFloat(p.poids)||0;
    if (!w || !slotsSejour.length) return;
    var cnt = 0; slotsSejour.forEach(function(s){ if (presentSlot(p,s)) cnt++; });
    var a = w * cnt / slotsSejour.length;
    assP[p.foyer]=(assP[p.foyer]||0)+a; totalAss += a;
  });
  /* Répartition dépense par dépense : ciblée sur des ménages (e.pour),
     apéro/alcool (personnes concernées seulement), liée à un repas (présents
     de ce repas), courses (assiduité aux repas), ou commune (tout le monde). */
  var total = 0, totGeneral = 0, totApero = 0, totCible = 0;
  DATA.expenses.forEach(function(e){
    var m = e.amount||0;
    total += m;
    if (paye[e.payer]===undefined) { paye[e.payer]=0; du[e.payer]=0; }
    paye[e.payer] += m;
    var cible = Array.isArray(e.pour) ? e.pour.filter(function(f){ return parts.hasOwnProperty(f); }) : [];
    if (cible.length) {
      totCible += m;
      var pc = 0; cible.forEach(function(f){ pc += parts[f]||0; });
      if (pc > 0) cible.forEach(function(f){ du[f] += m*(parts[f]||0)/pc; });
      else cible.forEach(function(f){ du[f] += m/cible.length; });
    } else if (e.link==='apero' && totalApero > 0) {
      totApero += m;
      Object.keys(aperoP).forEach(function(f){ du[f] += m*(aperoP[f]||0)/totalApero; });
    } else if (slotsSejour.length && slotsSejour.indexOf(e.link) !== -1) {
      totGeneral += m;
      var ps = {}, pt = 0;
      DATA.participants.forEach(function(p){
        var w = parseFloat(p.poids)||0;
        if (w && presentSlot(p, e.link)) { ps[p.foyer]=(ps[p.foyer]||0)+w; pt += w; }
      });
      if (pt > 0) Object.keys(ps).forEach(function(f){ du[f] += m*ps[f]/pt; });
      else if (totalParts > 0) Object.keys(parts).forEach(function(f){ du[f] += m*(parts[f]||0)/totalParts; });
    } else if (e.link==='courses' && totalAss > 0) {
      totGeneral += m;
      Object.keys(assP).forEach(function(f){ du[f] += m*(assP[f]||0)/totalAss; });
    } else {
      totGeneral += m;
      if (totalParts > 0) Object.keys(parts).forEach(function(f){ du[f] += m*(parts[f]||0)/totalParts; });
    }
  });
  var coutPart = totalParts>0 ? totGeneral/totalParts : 0;
  var lignes = Object.keys(paye).map(function(f){
    return { foyer:f, parts:parts[f]||0, paye:paye[f]||0, du:du[f]||0, solde:(paye[f]||0)-(du[f]||0) };
  });
  var deb=lignes.filter(function(l){return l.solde<-0.01;}).map(function(l){return{f:l.foyer,m:-l.solde};}).sort(function(a,b){return b.m-a.m;});
  var cre=lignes.filter(function(l){return l.solde>0.01;}).map(function(l){return{f:l.foyer,m:l.solde};}).sort(function(a,b){return b.m-a.m;});
  var vir=[], i=0, j=0;
  while(i<deb.length && j<cre.length){
    var m=Math.min(deb[i].m,cre[j].m);
    vir.push({de:deb[i].f,vers:cre[j].f,montant:m});
    deb[i].m-=m; cre[j].m-=m;
    if(deb[i].m<0.01)i++; if(cre[j].m<0.01)j++;
  }
  return { total:total, totalParts:totalParts, coutPart:coutPart, lignes:lignes, virements:vir, partsParFoyer:parts, prorata:prorata,
           totGeneral:totGeneral, totApero:totApero, totCible:totCible, absences:nbAbsents>0 };
}

/* ------------------------- Serveur ------------------------------------- */

function setSync(s) {
  var b = document.getElementById('btn-sync');
  if (b) b.textContent = s==='…' ? '…' : s==='ok' ? '✓' : s==='échec' ? '!' : '⟳';
}
function charger() {
  google.script.run.withSuccessHandler(function(j){
    DATA = JSON.parse(j);
    if (PREMIER) {
      PREMIER = false;
      if (!DATA.participants.length) TAB = 'reglages';
    }
    render();
  }).withFailureHandler(function(){
    document.getElementById('app').innerHTML = '<p class="info">Impossible de charger. Vérifie ta connexion et recharge la page.</p>';
  }).getData();
}

/* Photo : recompression canvas (max 1600 px, JPEG). PDF ou image illisible :
   envoi tel quel si moins de 5 Mo. L'échec n'empêche jamais d'enregistrer. */
function preparerFacture(file, base, ok, ko) {
  var type = file.type || '';
  function brut() {
    if (file.size > MAX_PJ) { ko('Dépense enregistrée sans la facture : fichier trop lourd (5 Mo max).'); return; }
    var ext = (file.name && file.name.indexOf('.') !== -1) ? '.' + file.name.split('.').pop() : '';
    var r = new FileReader();
    r.onload = function(){ ok(base + ext, type || 'application/octet-stream', String(r.result).split(',')[1]); };
    r.onerror = function(){ ko('Dépense enregistrée sans la facture : fichier illisible.'); };
    r.readAsDataURL(file);
  }
  if (type.indexOf('image/') !== 0) { brut(); return; }
  var url = URL.createObjectURL(file);
  var img = new Image();
  img.onload = function(){
    try {
      var k = Math.min(1, 1600 / Math.max(img.width, img.height));
      var cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      var d = cv.toDataURL('image/jpeg', 0.82);
      URL.revokeObjectURL(url);
      ok(base + '.jpg', 'image/jpeg', d.split(',')[1]);
    } catch (e) { URL.revokeObjectURL(url); brut(); }
  };
  img.onerror = function(){ URL.revokeObjectURL(url); brut(); };
  img.src = url;
}

    var meme = bs.every(function(x){return x.a===bs[0].a && x.d===bs[0].d;});
    res.push({ foyer:f, n:membres.length, meme:meme, b:bs[0],
      detail: meme ? null : membres.map(function(p,i){ return {nom:p.nom, b:bs[i]}; }) });
  });
  return res;
}
function libPresence(b) {
  var cfg = DATA.config||{};
  if (!dateValide(b.a) || !dateValide(b.d)) return '';
  if (b.a===cfg.debut && b.d===cfg.fin) return 'tout le séjour';
  if (b.a===cfg.debut) return 'jusqu\'au '+jourCourt(enDate(b.d));
  if (b.d===cfg.fin) return 'à partir du '+jourCourt(enDate(b.a));
  return 'du '+jourCourt(enDate(b.a))+' au '+jourCourt(enDate(b.d));
}
function textePresences() {

  recapPresence().forEach(function(r){

    else {

      r.detail.forEach(function(d){ l.push('- '+d.nom+' : '+libPresence(d.b)); });
    }
  });
  return l.join('\n');
}

function partagerTexte(t, fb) {
  if (navigator.share) {
    navigator.share({text:t}).catch(function(e){
      if (!e || e.name!=='AbortError') copierTexte(t, fb);
    });
  } else copierTexte(t, fb);
}
function partagerTab() {
  var t = TAB==='repas' ? texteRepas()
        : TAB==='depenses' ? texteDepenses()
        : TAB==='comptes' ? texteComptes()
        : TAB==='chambres' ? texteChambres()
        : TAB==='reglages' ? texteReglages()
        : texteFamille();
  partagerTexte(t);
}
function partagerCourses() {
  partagerTexte(texteCourses(), function(){ feedbackPartage('btn-partage-pb'); });
}
function copierTexte(t, cb) {
  var fin = cb || feedbackPartage;
  function ok(){ fin(); }
  function manuel(){
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { if (document.execCommand('copy')) fin(); } catch(e) {}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, manuel);
  else manuel();
}
function feedbackPartage(id) {
  var bid = (typeof id==='string') ? id : 'btn-partage';
  var b = document.getElementById(bid);
  if (!b) return;
  b.textContent = '✓';
  setTimeout(function(){
    var b2 = document.getElementById(bid);
    if (b2) b2.innerHTML = ICONE_PARTAGE;
  }, 1200);
}

      var aCom = bs.every(function(x){return x.a===bs[0].a;}) ? bs[0].a : null;
      var dCom = bs.every(function(x){return x.d===bs[0].d;}) ? bs[0].d : null;
      h += '<div class="presence"><span class="dep-meta">du</span>';
      h += '<select class="select-compact flex1" onchange="majPresenceFoyer('+fi+',\'arrivee\',this.value)" aria-label="Arrivée du ménage '+esc(f)+'">';
      if (!aCom) h += '<option value="" selected disabled>—</option>';
      JOURS.forEach(function(j){ h+='<option value="'+j.id+'"'+(aCom===j.id?' selected':'')+'>'+j.court+'</option>'; });
      h += '</select><span class="dep-meta">au</span>';
      h += '<select class="select-compact flex1" onchange="majPresenceFoyer('+fi+',\'depart\',this.value)" aria-label="Départ du ménage '+esc(f)+'">';
      if (!dCom) h += '<option value="" selected disabled>—</option>';
      JOURS.forEach(function(j){ h+='<option value="'+j.id+'"'+(dCom===j.id?' selected':'')+'>'+j.court+'</option>'; });
      h += '</select>';
      h += '<button class="btn-wifi" style="flex:0 0 auto;padding:8px 10px;font-size:12.5px'+(PRESENCE_DETAIL[f]?';background:#1E3350;color:#fff':'')+'" onclick="toggleDetailPresence('+fi+')" aria-label="Régler la présence personne par personne pour '+esc(f)+'">Par personne</button>';
      h += '</div>';
    }
    membres.forEach(function(p){
      h += '<div class="ligne-foyer"><input class="input-nu" style="flex:1;min-width:0;font-size:15px;font-weight:600" value="'+esc(p.nom)+'" aria-label="Renommer '+esc(p.nom)+'" onblur="commitNomPar(\''+p.id+'\',this)">';
      h += '<select class="select-compact" style="max-width:124px" onchange="majParticipant(\''+p.id+'\',\'foyer\',this.value)" aria-label="Ménage de '+esc(p.nom)+'">';
      foyers.forEach(function(ff){ h+='<option value="'+esc(ff)+'"'+(p.foyer===ff?' selected':'')+'>'+esc(ff)+'</option>'; });
      h += '</select>';
      h += '<select class="select-compact" style="width:66px" onchange="majParticipant(\''+p.id+'\',\'poids\',this.value)" aria-label="Parts de '+esc(p.nom)+'">';
      [['1','1'],['0.5','½'],['0','0']].forEach(function(o){
        h+='<option value="'+o[0]+'"'+(String(p.poids)===o[0]?' selected':'')+'>'+o[1]+'</option>';
      });
      h += '</select>';
      h += '<button class="btn-discret'+(aperoDe(p)?' actif':'')+'" style="width:30px;height:34px" onclick="majParticipant(\''+p.id+'\',\'apero\','+(aperoDe(p)?0:1)+')" aria-label="'+esc(p.nom)+(aperoDe(p)?' : ne plus compter dans les dépenses apéro/alcool':' : compter dans les dépenses apéro/alcool')+'">'+ICONE_APERO+'</button>';
      h += btnSuppr('par-'+p.id, "supprParticipant('"+p.id+"')", 'Retirer '+p.nom);
      h += '</div>';
      if (JOURS.length) {
        var b = bornesPresence(p);
        if (edF && PRESENCE_DETAIL[f]) {
          h += '<div class="presence"><span class="dep-meta">du</span>';
          h += '<select class="select-compact flex1" onchange="majParticipant(\''+p.id+'\',\'arrivee\',this.value)" aria-label="Arrivée de '+esc(p.nom)+'">';
          JOURS.forEach(function(j){ h+='<option value="'+j.id+'"'+(b.a===j.id?' selected':'')+'>'+j.court+'</option>'; });
          h += '</select><span class="dep-meta">au</span>';
          h += '<select class="select-compact flex1" onchange="majParticipant(\''+p.id+'\',\'depart\',this.value)" aria-label="Départ de '+esc(p.nom)+'">';
          JOURS.forEach(function(j){ h+='<option value="'+j.id+'"'+(b.d===j.id?' selected':'')+'>'+j.court+'</option>'; });
          h += '</select></div>';
        } else if (!edF && (b.a !== cfg.debut || b.d !== cfg.fin)) {
          h += '<div class="presence"><span class="dep-meta">présent du '+(dateValide(b.a)?jourCourt(enDate(b.a)):b.a)+' au '+(dateValide(b.d)?jourCourt(enDate(b.d)):b.d)+'</span></div>';
        }
      }
    });
    h += '</section>';
  });
  h += '<section class="carte"><h2 class="carte-titre">Ménages</h2>';
  h += '<p class="aide">Le nom d\'un ménage se modifie directement sur sa carte, dépenses et repas suivent. Ici : ajout, et suppression des ménages vides.</p>';
  listeFoyers().forEach(function(f, i){
    var nb = DATA.participants.filter(function(p){return p.foyer===f;}).length;
    if (nb) return;
    h += '<div class="ligne-h" style="align-items:center">';
    h += '<input class="flex1" value="'+esc(f)+'" data-de="'+esc(f)+'" aria-label="Renommer le ménage '+esc(f)+'" onblur="commitFoyer(this)">';
    h += '<span class="dep-meta" style="flex-shrink:0">vide</span>';
    h += btnSuppr('foy-'+f, 'supprFoyer('+i+')', 'Supprimer le ménage '+f);
    h += '</div>';
  });
  h += '<div class="ligne-h"><input id="reg-foyer" class="flex1" placeholder="Nouveau ménage (ex : Durand)" onkeydown="if(event.key===\'Enter\')ajouterFoyer()">';
  h += '<button class="btn" style="width:auto;padding:11px 16px" onclick="ajouterFoyer()">Ajouter</button></div>';
  h += '</section>';
  h += '<p class="aide">Total : '+DATA.participants.length+' personnes · '+frNum(c.totalParts)+' parts.</p>';
  return h;
}

function renderReglages() {
  var c = DATA.config||{};
  var h = '<p class="aide">Le séjour se paramètre ici : titre, dates et logements. Les ménages et les participants se gèrent dans l\'onglet Famille.</p>';
  h += '<section class="carte"><h2 class="carte-titre">Le séjour</h2>';
  h += '<input value="'+esc(c.titre||'')+'" placeholder="Nom du séjour (ex : Saint Jacut été 2026)" aria-label="Nom du séjour" onblur="commitConfig(\'titre\',this)">';
  h += '<input value="'+esc(c.sousTitre||'')+'" placeholder="Lieu (facultatif, affiché sous le titre)" aria-label="Lieu du séjour" onblur="commitConfig(\'sousTitre\',this)">';
  h += '<div class="ligne-h">';
  h += '<div class="flex1"><div class="dep-meta" style="margin-bottom:4px">Arrivée</div><input type="date" value="'+esc(dateValide(c.debut)?c.debut:'')+'" aria-label="Date d\'arrivée" onchange="commitConfig(\'debut\',this)"></div>';
  h += '<div class="flex1"><div class="dep-meta" style="margin-bottom:4px">Départ</div><input type="date" value="'+esc(dateValide(c.fin)?c.fin:'')+'" aria-label="Date de départ" onchange="commitConfig(\'fin\',this)"></div>';
  h += '</div>';
  if (dateValide(c.debut) && dateValide(c.fin) && c.fin < c.debut) h += '<p class="erreur">La date de départ est avant l\'arrivée.</p>';
  else h += '<p class="aide">Le planning des repas couvre ces dates : dîner seulement le jour d\'arrivée, déjeuner seulement le jour du départ.</p>';
  h += '<label class="alerte-cat"><input type="checkbox"'+(c.prorata?' checked':'')+' onchange="commitProrata(this.checked)"><span>Comptes au prorata des nuits de présence</span></label>';
  h += '<p class="aide">'+(c.prorata?'Chacun paie selon ses nuits sur place. Les dates d\'arrivée et de départ de chacun se règlent dans l\'onglet Famille.':'Décoché : chaque part vaut pour tout le séjour, quelles que soient les dates de présence de chacun.')+'</p>';
  h += '</section>';
  DATA.batiments.forEach(function(b){
    h += '<section class="carte">';
    h += '<div class="ligne-h" style="align-items:center">';
    h += '<input class="flex1" style="font-weight:700" value="'+esc(b.nom)+'" aria-label="Nom du logement" onblur="commitBatiment(\''+b.id+'\',this)">';
    h += btnSuppr('bat-'+b.id, "supprBatiment('"+b.id+"')", 'Supprimer le logement '+b.nom);
    h += '</div>';
    b.rooms.forEach(function(r){
      h += '<div class="chambre-bloc">';
      h += '<div class="ligne-h" style="align-items:center">';
      h += '<input class="flex1" value="'+esc(r.nom)+'" aria-label="Nom de la chambre" onblur="commitRoom(\''+r.id+'\',\'nom\',this)">';
      h += '<select class="select-compact" aria-label="Nombre de couchages" onchange="commitRoom(\''+r.id+'\',\'cap\',this)">';
      for (var cp=1; cp<=12; cp++) h += '<option value="'+cp+'"'+(r.cap===cp?' selected':'')+'>'+cp+' pers.</option>';
      h += '</select>';
      h += btnSuppr('room-'+r.id, "supprRoom('"+r.id+"')", 'Supprimer '+r.nom);
      h += '</div>';
      h += '<input class="input-menu" style="margin-top:0" value="'+esc(r.lits||'')+'" placeholder="Lits (ex : 1 double + 1 simple, facultatif)" aria-label="Lits de '+esc(r.nom)+'" onblur="commitRoom(\''+r.id+'\',\'lits\',this)">';
      h += '</div>';
    });
    h += '<button class="btn-pj" onclick="ajouterRoom(\''+b.id+'\')">+ Ajouter une chambre</button>';
    h += '</section>';
  });
  h += '<button class="btn-pj" onclick="ajouterBatiment()">+ Ajouter un logement (maison, gîte, annexe…)</button>';
  return h;
}

function render() {
  if (!DATA) return;
  JOURS = joursSejour();
  var c = DATA.config||{};
  try { document.title = c.titre || 'Séjour'; } catch(e) {}
  var h = '<div class="mariniere" aria-hidden="true"></div>';
  h += '<header class="entete"><div style="min-width:0"><div class="surtitre">'+esc(periodeCourte())+(c.sousTitre?' · '+esc(c.sousTitre):'')+'</div><h1>'+esc(c.titre||'Notre séjour')+'</h1></div>';
  h += '<div style="display:flex;gap:8px;flex-shrink:0">';
  h += '<button class="btn-discret'+(PANNEAU||LOGIN_UI?' actif':'')+'" onclick="toucherAdmin()" aria-label="Administration">⋯</button>';
  h += '<button id="btn-partage" class="btn-refresh" onclick="partagerTab()" aria-label="Partager l\'onglet affiché">'+ICONE_PARTAGE+'</button>';
  h += '<button id="btn-sync" class="btn-refresh" onclick="charger()" aria-label="Actualiser">⟳</button></div></header>';
  h += '<p class="note-partage">Données communes à tout le groupe : ce que tu saisis ici est visible et modifiable par tous.</p>';
  h += '<main class="contenu">';
  if (LOGIN_UI && !ADMIN_CRED) {
    h += '<section class="carte alerte"><h2 class="carte-titre">Connexion admin</h2>';
    h += '<input id="adm-email" inputmode="email" autocomplete="username" placeholder="Identifiant (adresse mail)">';
    h += '<input id="adm-pass" type="password" autocomplete="current-password" placeholder="Mot de passe" onkeydown="if(event.key===\'Enter\')loginAdmin()">';
    h += '<p id="adm-erreur" class="erreur"></p>';
    h += '<div class="ligne-h"><button class="btn flex1" onclick="loginAdmin()">Se connecter</button>';
    h += '<button class="btn-x" onclick="LOGIN_UI=false;render()" aria-label="Annuler la connexion">Annuler</button></div>';
    h += '</section>';
  }
  if (ADMIN_CRED && PANNEAU) {
    h += '<section class="carte alerte"><h2 class="carte-titre">Alertes mail</h2>';
    if (!ADMIN_CFG) h += '<p class="aide">Chargement…</p>';
    else {
      h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">';
      h += '<div class="dep-meta" style="flex:1">'+(ADMIN_CFG.on?'Un mail à chaque modification des catégories cochées.':'Coupées, aucun mail envoyé.')+'</div>';
      h += '<button class="btn" style="width:auto;padding:11px 16px" onclick="basculerAlertes()">'+(ADMIN_CFG.on?'Couper':'Activer')+'</button></div>';
      if (ADMIN_CFG.on) {
        CATS_ALERTES.forEach(function(cc){
          h += '<label class="alerte-cat"><input type="checkbox"'+(ADMIN_CFG.cats[cc[0]]?' checked':'')+' onchange="majCatAlerte(\''+cc[0]+'\',this.checked)"><span>'+cc[1]+'</span></label>';
        });
      }
      h += '<div class="dep-label" style="margin-top:4px">Mot de passe admin</div>';
      h += '<div class="ligne-h"><input id="adm-nouveau" type="password" class="flex1" autocomplete="new-password" placeholder="Nouveau mot de passe">';
      h += '<button class="btn" style="width:auto;padding:11px 14px" onclick="changerPass()">Changer</button></div>';
      h += '<p id="adm-perr" class="erreur"></p>';
      h += '<div class="dep-meta">Connecté : '+esc(ADMIN_CRED.email)+'</div>';
      h += '<button class="btn-x" style="text-align:right;font-size:13px;padding:0" onclick="deconnexionAdmin();render()">Se déconnecter sur cet appareil</button>';
    }
    h += '</section>';
  }
  h += TAB==='repas' ? renderRepas()
     : TAB==='depenses' ? renderDepenses()
     : TAB==='comptes' ? renderComptes()
     : TAB==='chambres' ? renderChambres()
     : TAB==='reglages' ? renderReglages()
     : renderFamille();
  h += '</main>';
  h += '<nav class="tabs">';
  [['repas','Repas'],['depenses','Dépenses'],['comptes','Comptes'],['chambres','Chambres'],['famille','Famille'],['reglages','Réglages']].forEach(function(t){
    h += '<button class="tab'+(TAB===t[0]?' actif':'')+'" onclick="allerTab(\''+t[0]+'\')">'+t[1]+'</button>';
  });
  h += '</nav>';
  document.getElementById('app').innerHTML = h;
  majQR();
}

document.addEventListener('visibilitychange', function(){
  if (document.visibilityState==='visible' && DATA) charger();
});
try {
  var credStock = localStorage.getItem('sejour_admin_cred');
  if (credStock) ADMIN_CRED = JSON.parse(credStock);
} catch(e) {}
google.script.url.getLocation(function(loc){
  if (loc && loc.parameter && loc.parameter.admin==='1' && !ADMIN_CRED) {
    LOGIN_UI = true;
    render();
  }
});
charger();
</script>
</body>
</html>
